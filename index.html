<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Change the title shown in browser -->
  <title>LinkNest</title>

  <!-- Makes the site mobile responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main profile card -->
  <div class="card">

    <!-- Replace assets/profile.jpg with your own image -->
    <img class="avatar" src="assets/profile.jpg" alt="Profile">

    <!-- Change your name -->
    <h1>Mohan</h1>

    <!-- Change your bio -->
    <p>M.Sc Computer Science Student</p>

    <!-- Replace # with your real links -->
    <a href="#">💻 GitHub</a>
    <a href="#">🌐 Portfolio</a>
    <a href="#">📄 Resume</a>
    <a href="#">📧 Email</a>

    <!-- Theme toggle -->
    <button id="themeBtn">🌙 Toggle Theme</button>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
